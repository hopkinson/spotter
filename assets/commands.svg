<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Spotter 8 个命令一览">
  <rect width="760" height="340" rx="10" fill="#0d1117"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/><rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" font-size="12" fill="#8b949e" font-family="Consolas, 'Microsoft YaHei', 'PingFang SC', monospace">spotter · 8 commands</text>
  <g font-family="Consolas, 'SFMono-Regular', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="15">
    <text x="24" y="70" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-plan</tspan>
      <tspan x="250" fill="#c9d1d9">先问清取舍，给草图和验收用例，等你确认</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.05;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="103" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-review</tspan>
      <tspan x="250" fill="#c9d1d9">只读审查：正确性、测试缺口、冗余</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.13;0.15;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="136" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-audit [--full]</tspan>
      <tspan x="250" fill="#c9d1d9">累积改动或全仓：漏洞、数据丢失、测试缺口</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.25;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="169" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-refactor [路径]</tspan>
      <tspan x="250" fill="#c9d1d9">哪里值得重构，给最小改法</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.35;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="202" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-release</tspan>
      <tspan x="250" fill="#c9d1d9">预检 → 授权后推送 → 跟踪部署 → 线上验收</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.43;0.45;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="235" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-log</tspan>
      <tspan x="250" fill="#c9d1d9">记录结果与证据，生成周报草稿</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.55;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="268" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-graph</tspan>
      <tspan x="250" fill="#c9d1d9">每次提交后自动刷新代码图谱</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.65;0.94;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="24" y="301" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> <tspan fill="#79c0ff">/spot-update</tspan>
      <tspan x="250" fill="#c9d1d9">检查随包技能的上游版本与许可</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.73;0.75;0.94;1" dur="14s" repeatCount="indefinite"/></text>
  </g>
</svg>
