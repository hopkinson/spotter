<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Spotter demo: /spot-plan asks the decisions that change the outcome, then waits for confirmation">
  <rect width="760" height="330" rx="10" fill="#0d1117"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" font-size="12" fill="#8b949e" font-family="Consolas, 'Microsoft YaHei', 'PingFang SC', monospace">spotter · 输出示意 / illustrative</text>
  <g font-family="Consolas, 'SFMono-Regular', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="15">
    <text x="24" y="70" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> /spot-plan 给订单列表加导出 CSV
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.05;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="108" fill="#e6edf3">先确认两点会改变结果的取舍：
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.17;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="44" y="136" fill="#79c0ff">1. 导出当前筛选结果，还是全部订单？
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.26;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="44" y="164" fill="#79c0ff">2. 单次上限多少行？
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.34;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="202" fill="#e6edf3"><tspan fill="#7ee787">&gt;</tspan> 当前筛选，上限 10 万行
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.48;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="240" fill="#e6edf3">改前 / 改后草图 + 验收用例：
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.62;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="44" y="268" fill="#d2a8ff">导出筛选结果｜CSV 行数 = 列表行数
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.70;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="44" y="292" fill="#d2a8ff">超过上限｜提示并截断，不静默丢行
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.76;0.94;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="318" fill="#ffa657">等你确认后才开工
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.84;0.86;0.94;1" dur="16s" repeatCount="indefinite"/></text>
  </g>
</svg>
